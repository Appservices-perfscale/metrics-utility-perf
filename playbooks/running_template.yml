---
- name: Run "automation" template on multiple inventories 20 times
  hosts: localhost
  gather_facts: no
  vars:
    controller_url: "https://3.86.144.98"  # Ansible Controller API URL
    controller_username: "admin2"
    controller_password: "admin2"
    inventories:
      - AWS
      - AZURE
      - GCP
      - RHEL
    repeat_count: 17  # Number of times to run

  tasks:
    - name: Launch the "automation" job template multiple times with specific inventory
      awx.awx.job_launch:
        controller_host: "{{ controller_url }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: no
        job_template: "automation"
        inventory: "{{ item.1 }}"  # Pass inventory name dynamically
        extra_vars: {}
        wait: yes  # Wait for job completion
      loop: "{{ range(repeat_count) | product(inventories) | list }}"
      loop_control:
        label: "Run {{ item.0 + 1 }} on {{ item.1 }}"
      register: job_results

    - name: Display job results
      debug:
        var: job_results
