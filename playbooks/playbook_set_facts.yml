    #     dest: /tmp/host_facts_{{ inventory_hostname }}.json
    #     content: |
    #       {
    #         "host": "{{ inventory_hostname }}",
    #         "flavor": {{ '"MacOS"' if is_macos else '"RHEL"' if is_rhel else '"AWS"' if is_aws else '"GCP"' if is_gcp else '"Azure"' if is_azure else '"Unknown"' }},
