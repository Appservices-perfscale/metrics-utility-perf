---
- name: Configure hosts facts based on detected host flavor
  hosts: all
  gather_facts: yes  # Ensure Ansible gathers host facts
  vars:
    # Define custom host configurations based on facts
    host_flavors:
      RHEL:
        os_family: "RedHat"
        environment: "on-prem"
        role: "enterprise_server"
      AWS:
        cloud_provider: "Amazon"
        environment: "cloud"
        role: "aws_instance"
      GCP:
        cloud_provider: "Google"
        environment: "cloud"
        role: "gcp_instance"
      Azure:
        cloud_provider: "Microsoft Azure"
        environment: "cloud"
        role: "azure_instance"
      MacOS:
        os_family: "Darwin"
        environment: "workstation"
        role: "developer_machine"

    mock_host_flavor: "RHEL" #change this to mock what you want
    inventory_id: "6" 
    api_token: "tJIe1TuJIWBwgrYQlQgjpibyLZf2YO"  
    controller_url: "https://18.207.188.125/api/controller/v2/bulk/host_create/"  


  tasks:
    # - name: Create 5 hosts dynamically in Ansible Controller
    #   uri:
    #     url: "{{ controller_url }}"
    #     method: POST
    #     headers:
    #       Authorization: "Bearer {{ api_token }}"
    #       Content-Type: "application/json"
    #     body: |
    #       {
    #           "inventory": {{ inventory_id }},
    #           "hosts": [
    #               {"name": "host{{ item }}", "variables": "ansible_connection: local"},
    #           ]
    #       }
    #     body_format: json
    #     status_code: 201
    #     validate_certs: no  # Disable SSL verification
    #   loop: "{{ range(1, 6) | list }}"
    #   register: created_hosts
    #   tags: create_hosts

    - name: Mock Ansible facts for testing (simulate specific OS family and virtualization type).
      set_fact:
        ansible_facts:
          ansible_virtualization_type: "{{ 'aws' if mock_host_flavor == 'AWS' else 'gcp' if mock_host_flavor == 'GCP' else 'azure' if mock_host_flavor == 'Azure' else '' }}"
        ansible_os_family: "{{ 'RedHat' if mock_host_flavor == 'RHEL' else 'Darwin' if mock_host_flavor == 'MacOS' else '' }}"
        cacheable: true
      when: mock_host_flavor | length > 0  # Only mock if the variable is set

    # - name: Load facts from JSON file
    #   set_fact:
    #     additional_facts: "{{ lookup('file', playbook_dir + '/data.json') | from_json }}"

    - name: Detect host flavor based on Ansible facts
      set_fact:
        detected_flavor: >-
          {% if ansible_os_family | default('') == 'RedHat' %}
            RHEL
          {% elif ansible_facts['ansible_virtualization_type'] | default('') == 'aws' %}
            AWS
          {% elif ansible_facts['ansible_virtualization_type'] | default('') == 'gcp' %}
            GCP
          {% elif ansible_facts['ansible_virtualization_type'] | default('') == 'azure' %}
            Azure
          {% elif ansible_os_family | default('') == 'Darwin' %}
            MacOS
          {% else %}
            Unknown
          {% endif %}
        cacheable: true

    - name: Fail if the host flavor is unknown
      fail:
        msg: "Could not determine the host flavor. We need either RHEL, AWS, GCP, Azure, or MacOS."
      when: detected_flavor == "Unknown"

    - name: Detect host type based on Ansible facts
      set_fact:
        is_macos: "{{ ansible_os_family == 'Darwin' }}"
        is_rhel: "{{ ansible_os_family == 'RedHat' }}"
        is_aws: "{{ ansible_facts.get('ansible_virtualization_type', '') == 'aws' }}"
        is_gcp: "{{ ansible_facts.get('ansible_virtualization_type', '') == 'gcp' }}"
        is_azure: "{{ ansible_facts.get('ansible_virtualization_type', '') == 'azure' }}"

    - name: Set custom host facts for MacOS
      set_fact:
        custom_host_facts: 
          host_flavor: "{{ host_flavors['MacOS'] }}"
          host_author: "Larry"
          cacheable: true
        when: is_macos | bool

    - name: Set custom host facts for RHEL
      set_fact:
        custom_host_facts: "{{ host_flavors['RHEL'] }}"
        cacheable: true
      when: is_rhel | bool

    - name: Set custom host facts for AWS
      set_fact:
        custom_host_facts: "{{ host_flavors['AWS'] }}"
        cacheable: true
      when: is_aws | bool

    - name: Set custom host facts for GCP
      set_fact:
        custom_host_facts: "{{ host_flavors['GCP'] }}"
        cacheable: true
      when: is_gcp | bool

    - name: Set custom host facts for Azure
      set_fact:
        custom_host_facts: "{{ host_flavors['Azure'] }}"
        cacheable: true
      when: is_azure | bool

    - name: Display detected host flavor and custom facts
      debug:
        msg: |
          Host Flavor: {{ 'MacOS' if is_macos else 'RHEL' if is_rhel else 'AWS' if is_aws else 'GCP' if is_gcp else 'Azure' if is_azure else 'Unknown' }}
          Custom Host Facts: {{ custom_host_facts }}
      when: custom_host_facts is defined

    # - name: Save host facts to a JSON file (if flavor is detected)
