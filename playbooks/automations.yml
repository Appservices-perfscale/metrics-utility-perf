---
- name: Pick a Random Task
  hosts: all
  gather_facts: no
  tasks:
    - name: Select a Random Task Type
      set_fact:
        selected_task: "{{ [0, 1, 2, 3, 4] | random }}"

    - name: Debug Selected Task
      debug:
        msg: "Selected task is {{ selected_task }}"

    - name: Task 1 - Echo Hello World
      command: echo "Hello, World from {{ inventory_hostname }}!"
      when: selected_task == "0"

    - name: Task 2 - Print Current Directory
      command: pwd
      register: current_path
      when: selected_task == "1"

    - name: Task 3 - Print Hello World
      debug:
        msg: "Hello, World!"
      when: selected_task == "2"

    - name: Task 4 - Show Current Date & Time
      command: date
      register: current_date
      when: selected_task == "3"

    - name: Task 5 - List Files in Current Directory
      command: ls -l
      register: file_list
      when: selected_task == "4"
